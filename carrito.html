<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Doggy's</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        
        .nav-custom {
            background: rgba(26, 26, 46, 0.95) !important;
        }
        
        .cart-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        
        .bg-purple { background-color: #a335ee !important; }
        .rarity-common { border-left: 4px solid #b0b0b0; }
        .rarity-rare { border-left: 4px solid #0070dd; }
        .rarity-epic { border-left: 4px solid #a335ee; }
        .rarity-legendary { border-left: 4px solid #ff8000; }
        
        .skeleton { /* ... (Estilos de skeleton se mantienen) ... */ }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg nav-custom sticky-top">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold" href="index.html">DOGGY'S 🌭</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">Menú</a></li>
                </ul>
                <a href="cuenta.html" class="btn btn-outline-light me-2">Mi Cuenta</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="text-center mb-5 text-warning">🛒 Carrito de Batalla</h1>

        <div id="cartContainer" class="row g-4"></div>

        <div id="cartSummary" class="row justify-content-end mt-5" style="display:none;">
            <div class="col-md-5">
                <div class="p-4 cart-item">
                    <h4 class="text-white border-bottom pb-2 mb-3">Resumen del Pedido</h4>
                    <p class="d-flex justify-content-between">Subtotal: <span id="subtotal"></span></p>
                    <p class="d-flex justify-content-between">Costo de Envío 🚚: <span id="shipping"></span></p>
                    <h5 class="d-flex justify-content-between text-warning fw-bold pt-2 border-top border-warning">Total: <span id="total"></span></h5>
                    <button class="btn btn-success w-100 mt-3" id="checkoutBtn" onclick="checkout()">✅ Finalizar Compra</button>
                    <button class="btn btn-outline-danger w-100 mt-2" onclick="clearCart()">🗑️ Vaciar Carrito</button>
                </div>
            </div>
        </div>
        
        <div id="emptyCartMessage" class="text-center mt-5" style="display:none;">
            <h3 class="text-white">Tu carrito está vacío 😔</h3>
            <p>¡Añade productos para empezar la batalla!</p>
            <a href="index.html" class="btn btn-warning mt-3">Ir al Menú</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8000/api';
        let currentUser = null; 

        document.addEventListener('DOMContentLoaded', function() {
            const userString = localStorage.getItem('doggyUser');
            if (userString) {
                currentUser = JSON.parse(userString);
            } else {
                alert('Debe iniciar sesión para ver su carrito.');
                window.location.href = 'login.html';
                return;
            }
            setTimeout(loadCart, 100);
        });

        function getCart() { return JSON.parse(localStorage.getItem('doggyCart')) || []; }
        
        // --- FUNCIÓN loadCart y auxiliares (debe ser completa) ---
        function loadCart() {
            const cart = getCart();
            const container = document.getElementById('cartContainer');
            const summary = document.getElementById('cartSummary');
            
            container.innerHTML = '';

            if (cart.length === 0) {
                summary.style.display = 'none';
                document.getElementById('emptyCartMessage').style.display = 'block';
                return;
            }

            summary.style.display = 'flex';
            document.getElementById('emptyCartMessage').style.display = 'none';

            let subtotal = 0;

            cart.forEach(item => {
                const totalItemPrice = item.price * item.quantity;
                subtotal += totalItemPrice;
                
                container.innerHTML += `
                    <div class="col-12">
                        <div class="cart-item p-3 d-flex align-items-center">
                            <h2 class="me-3 mb-0">${item.image || '🌭'}</h2>
                            <div class="flex-grow-1">
                                <h5 class="mb-1 text-warning">${item.name} <span class="badge ${getRarityBadgeClass(item.rarity)}">${getRarityText(item.rarity)}</span></h5>
                                <p class="mb-0">Precio unitario: $${item.price.toLocaleString()}</p>
                            </div>
                            <div class="d-flex align-items-center mx-4">
                                <button class="btn btn-sm btn-outline-danger me-2" onclick="updateQuantity('${item.id}', -1)">-</button>
                                <span class="fw-bold">${item.quantity}</span>
                                <button class="btn btn-sm btn-outline-success ms-2" onclick="updateQuantity('${item.id}', 1)">+</button>
                            </div>
                            <div class="text-end">
                                <h5 class="mb-0">$${totalItemPrice.toLocaleString()}</h5>
                                <button class="btn btn-sm btn-danger mt-1" onclick="removeItem('${item.id}')">Eliminar</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            const shippingCost = 1000;
            const total = subtotal + shippingCost;
            document.getElementById('subtotal').textContent = `$${subtotal.toLocaleString()}`;
            document.getElementById('shipping').textContent = `$${shippingCost.toLocaleString()}`;
            document.getElementById('total').textContent = `$${total.toLocaleString()}`;
        }

        function updateQuantity(id, change) {
            let cart = getCart();
            const itemIndex = cart.findIndex(item => item.id === id);

            if (itemIndex !== -1) {
                cart[itemIndex].quantity += change;

                if (cart[itemIndex].quantity <= 0) {
                    cart.splice(itemIndex, 1);
                }
            }
            localStorage.setItem('doggyCart', JSON.stringify(cart));
            loadCart();
        }

        function removeItem(id) {
            let cart = getCart();
            cart = cart.filter(item => item.id !== id);
            localStorage.setItem('doggyCart', JSON.stringify(cart));
            loadCart();
        }

        function clearCart() {
            if (confirm('¿Estás seguro de vaciar todo el carrito?')) {
                localStorage.removeItem('doggyCart');
                loadCart();
            }
        }
        
        // --- CHECKOUT (Lógica de Persistencia y Redirección) ---
        async function checkout() {
            if (!currentUser) {
                alert('Debe iniciar sesión para realizar el checkout.');
                return;
            }

            const cart = getCart();
            if (cart.length === 0) {
                alert('El carrito está vacío.');
                return;
            }

            const subtotalValue = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shippingCost = 1000;
            const totalValue = subtotalValue + shippingCost;

            const orderData = {
                user_id: currentUser.id, 
                items: cart.map(item => ({
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    quantity: item.quantity
                })),
                subtotal: subtotalValue,
                shipping: shippingCost,
                total: totalValue,
                status: 'procesando'
            };

            document.getElementById('checkoutBtn').disabled = true;
            document.getElementById('checkoutBtn').textContent = 'Procesando... ⏳';

            try {
                const response = await fetch(`${API_URL}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                const result = await response.json();

                if (!response.ok) {
                    alert(`❌ Error al finalizar compra: ${result.detail || 'Error desconocido del servidor'}`);
                    return;
                }

                // 1. Guardar el número de pedido para la página de rastreo
                localStorage.setItem('trackingNumber', result.order_number);

                alert(`✅ ¡Pedido #${result.order_number} confirmado!`);
                
                // 2. Vaciar carrito y redirigir a RASTREO
                localStorage.removeItem('doggyCart');
                
                window.location.href = 'rastreo.html'; // REDIRECCIÓN CLAVE

            } catch (error) {
                console.error('Error en checkout:', error);
                alert('❌ Error de conexión con la API. Asegúrate de que el Backend está corriendo.');
            } finally {
                document.getElementById('checkoutBtn').disabled = false;
                document.getElementById('checkoutBtn').textContent = '✅ Finalizar Compra';
            }
        }
        
        function getRarityText(rarity) {
            const rarityTexts = {
                'common': 'Común', 'rare': 'Raro', 'epic': 'Épico', 'legendary': 'Legendario'
            };
            return rarityTexts[rarity] || '';
        }
        
        function getRarityBadgeClass(rarity) {
            const badgeClasses = {
                'common': 'bg-secondary', 'rare': 'bg-primary', 'epic': 'bg-purple', 'legendary': 'bg-warning'
            };
            return badgeClasses[rarity] || 'bg-secondary';
        }
    </script>
</body>
</html>
