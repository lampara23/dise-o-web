<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Doggy's</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
        }
        
        .nav-custom {
            background: rgba(11, 11, 25, 0.95) !important;
            border-bottom: 2px solid #00f5ff;
        }
        
        .admin-card {
            background: rgba(30, 30, 50, 0.8);
            border: 2px solid #00f5ff;
            border-radius: 15px;
            transition: all 0.3s ease;
        }
        
        .section-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
        }
        
        .bg-purple {
            background-color: #a020f0 !important;
        }
        
        .list-group-item {
            background-color: rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .list-group-item-action:hover {
            background-color: rgba(0, 0, 0, 0.4);
        }
        
        .product-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg nav-custom sticky-top">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold" href="index.html">DOGGY'S ADMIN 👑</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="#productsSection">Productos</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#usersSection">Usuarios</a></li>
                </ul>
                <button class="btn btn-danger" onclick="logout()">👋 Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="text-center mb-5 text-warning">Panel de Administración</h1>

        <div id="productsSection" class="admin-card p-4 mb-5">
            <h2 class="border-bottom pb-2 mb-4">🌭 Gestión de Productos</h2>

            <div class="section-card p-4 mb-4">
                <h4 id="formTitle">➕ Agregar Nuevo Producto</h4>
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="productName" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                        <div class="col-md-3">
                            <label for="productPrice" class="form-label">Precio ($)</label>
                            <input type="number" class="form-control" id="productPrice" min="1" required>
                        </div>
                        <div class="col-md-3">
                            <label for="productStock" class="form-label">Stock</label>
                            <input type="number" class="form-control" id="productStock" min="0" required>
                        </div>
                        <div class="col-md-12">
                            <label for="productDescription" class="form-label">Descripción</label>
                            <textarea class="form-control" id="productDescription" rows="2" required></textarea>
                        </div>
                        <div class="col-md-3">
                            <label for="productCategory" class="form-label">Categoría</label>
                            <select id="productCategory" class="form-select" required>
                                <option value="completos">Completos</option>
                                <option value="hotdogs">Hot Dogs</option>
                                <option value="especiales">Especiales</option>
                                <option value="combos">Combos</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="productRarity" class="form-label">Rareza (Rarity)</label>
                            <select id="productRarity" class="form-select" required>
                                <option value="common">Común</option>
                                <option value="rare">Raro</option>
                                <option value="epic">Épico</option>
                                <option value="legendary">Legendario</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="productImage" class="form-label">Emoji/Imagen</label>
                            <input type="text" class="form-control" id="productImage" value="🌭">
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="" id="productLimited">
                                <label class="form-check-label" for="productLimited">
                                    Producto Limitado
                                </label>
                            </div>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-warning" id="saveBtn">💾 Guardar Producto</button>
                            <button type="button" class="btn btn-outline-secondary" id="cancelBtn" onclick="resetForm()" style="display:none;">Cancelar Edición</button>
                        </div>
                    </div>
                </form>
            </div>

            <h4>📊 Productos en el Inventario (<span id="productCount">0</span>)</h4>
            <div id="productList" class="list-group">
                <div class="text-center p-5" id="loadingProducts">
                    <div class="spinner-border text-warning" role="status"></div>
                    <p class="mt-2">Cargando productos...</p>
                </div>
            </div>
        </div>
        
        <div id="usersSection" class="admin-card p-4 mb-5">
            <h2 class="border-bottom pb-2 mb-4">👥 Gestión de Usuarios</h2>
            <h4>Lista de Usuarios Registrados</h4>
            <div id="userList" class="list-group">
                 <div class="text-center p-5" id="loadingUsers">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Cargando usuarios...</p>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8000/api';
        
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar si el usuario es Admin
            const user = JSON.parse(localStorage.getItem('doggyUser'));
            if (!user || user.role !== 'admin') {
                alert('Acceso denegado. Solo administradores.');
                window.location.href = 'login.html';
                return;
            }
            
            loadProducts();
            loadUsers(); 

            document.getElementById('productForm').addEventListener('submit', handleProductSubmit);
        });

        // --- FUNCIONES DE PRODUCTOS (CRUD) ---

        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/products`);
                const products = await response.json();
                
                document.getElementById('loadingProducts').style.display = 'none';
                document.getElementById('productCount').textContent = products.length;
                displayProducts(products);
            } catch (error) {
                console.error('Error cargando productos:', error);
                document.getElementById('loadingProducts').innerHTML = '<p class="text-danger mt-2">❌ Error al cargar productos del API.</p>';
            }
        }

        function displayProducts(products) {
            const list = document.getElementById('productList');
            list.innerHTML = products.map(product => `
                <div class="list-group-item product-list-item">
                    <div>
                        <span class="fs-4 me-2">${product.image}</span>
                        <h5 class="mb-1 d-inline-block">${product.name}</h5>
                        <span class="badge ${getRarityBadgeClass(product.rarity)} ms-2">${getRarityText(product.rarity)}</span>
                        ${product.limited ? '<span class="badge bg-danger ms-2">LIMITADO</span>' : ''}
                        <small class="text-muted d-block ms-5">Stock: ${product.stock} | $${product.price.toLocaleString()}</small>
                    </div>
                    <div>
                        <button class="btn btn-sm btn-info me-2" onclick="editProduct('${product._id}')">✏️ Editar</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProduct('${product._id}', '${product.name}')">🗑️ Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        async function handleProductSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('productId').value;
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/products/${id}` : `${API_URL}/products`;

            const productData = {
                name: document.getElementById('productName').value,
                price: parseInt(document.getElementById('productPrice').value),
                stock: parseInt(document.getElementById('productStock').value),
                description: document.getElementById('productDescription').value,
                category: document.getElementById('productCategory').value,
                rarity: document.getElementById('productRarity').value,
                image: document.getElementById('productImage').value,
                limited: document.getElementById('productLimited').checked,
                type: document.getElementById('productCategory').value 
            };
            
            document.getElementById('saveBtn').disabled = true;

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message);
                    resetForm();
                    loadProducts();
                } else {
                    alert(`❌ Error: ${data.detail || 'Algo salió mal. (Revisa la consola)'}`);
                }
            } catch (error) {
                console.error('Error al guardar producto:', error);
                alert('❌ Error de conexión con el servidor.');
            } finally {
                document.getElementById('saveBtn').disabled = false;
            }
        }

        async function editProduct(id) {
            try {
                const response = await fetch(`${API_URL}/products/${id}`);
                const product = await response.json();
                
                document.getElementById('productId').value = product._id;
                document.getElementById('productName').value = product.name;
                document.getElementById('productPrice').value = product.price;
                document.getElementById('productStock').value = product.stock;
                document.getElementById('productDescription').value = product.description;
                document.getElementById('productCategory').value = product.category;
                document.getElementById('productRarity').value = product.rarity;
                document.getElementById('productImage').value = product.image;
                document.getElementById('productLimited').checked = product.limited || false;
                
                document.getElementById('formTitle').textContent = `✏️ Editar Producto: ${product.name}`;
                document.getElementById('saveBtn').textContent = '💾 Actualizar Producto';
                document.getElementById('cancelBtn').style.display = 'inline-block';

                document.getElementById('productsSection').scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                console.error('Error al cargar producto para edición:', error);
                alert('❌ No se pudo cargar el producto.');
            }
        }

        async function deleteProduct(id, name) {
            if (!confirm(`¿Estás seguro de ELIMINAR permanentemente el producto: ${name}?`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/products/${id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();
                
                if (response.ok) {
                    alert(data.message);
                    loadProducts();
                } else {
                    alert(`❌ Error al eliminar: ${data.detail || 'Producto no encontrado.'}`);
                }
            } catch (error) {
                console.error('Error al eliminar producto:', error);
                alert('❌ Error de conexión con el servidor.');
            }
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('productImage').value = '🌭';
            document.getElementById('formTitle').textContent = '➕ Agregar Nuevo Producto';
            document.getElementById('saveBtn').textContent = '💾 Guardar Producto';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        // --- FUNCIONES DE USUARIOS ---
        
        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/users`);
                const users = await response.json();
                
                document.getElementById('loadingUsers').style.display = 'none';
                displayUsers(users);
            } catch (error) {
                console.error('Error cargando usuarios:', error);
                document.getElementById('loadingUsers').innerHTML = '<p class="text-danger mt-2">❌ Error al cargar usuarios del API.</p>';
            }
        }

        function displayUsers(users) {
            const list = document.getElementById('userList');
            list.innerHTML = users.map(user => `
                <div class="list-group-item list-group-item-action product-list-item">
                    <div>
                        <h5 class="mb-1 d-inline-block">${user.name} <small class="badge bg-secondary">${user.role.toUpperCase()}</small></h5>
                        <small class="text-muted d-block">${user.email}</small>
                    </div>
                    <div>
                        <small class="text-info">ID: ${user._id}</small>
                    </div>
                </div>
            `).join('');
        }

        // --- FUNCIONES AUXILIARES Y CERRAR SESIÓN ---

        function logout() {
            if (confirm('¿Estás seguro de cerrar sesión?')) {
                localStorage.removeItem('doggyUser');
                window.location.href = 'login.html';
            }
        }

        function getRarityText(rarity) {
            const rarityTexts = {
                'common': 'Común',
                'rare': 'Raro',
                'epic': 'Épico',
                'legendary': 'Legendario'
            };
            return rarityTexts[rarity] || '';
        }

        function getRarityBadgeClass(rarity) {
            const badgeClasses = {
                'common': 'bg-secondary',
                'rare': 'bg-primary',
                'epic': 'bg-purple',
                'legendary': 'bg-warning'
            };
            return badgeClasses[rarity] || 'bg-secondary';
        }
    </script>
</body>
</html>
