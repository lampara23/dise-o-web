<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - Doggy's</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        
        .nav-custom {
            background: rgba(26, 26, 46, 0.95) !important;
        }
        
        .section-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
        }
        
        .order-badge {
            min-width: 80px;
        }
        
        .list-group-item {
            border-color: rgba(255, 255, 255, 0.1);
            background-color: transparent;
        }
        
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.1) 75%);
            background-size: 400% 100%;
            animation: loading 1.5s infinite;
            border-radius: 5px;
        }

        @keyframes loading {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg nav-custom sticky-top">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold" href="index.html">DOGGY'S 🌭</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">Menú</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="carrito.html">Carrito</a></li>
                </ul>
                <button class="btn btn-danger" onclick="logout()">👋 Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="text-center mb-5 text-warning">Mi Cuenta</h1>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="section-card p-4">
                    <h4 class="border-bottom pb-2 mb-3">👤 Datos de Perfil</h4>
                    <p><strong>Nombre:</strong> <span id="userName" class="skeleton w-75 d-inline-block"></span></p>
                    <p><strong>Email:</strong> <span id="userEmail" class="skeleton w-75 d-inline-block"></span></p>
                    <p><strong>Miembro desde:</strong> <span id="memberSince" class="skeleton w-75 d-inline-block"></span></p>
                    <p><strong>ID de Usuario:</strong> <span id="userId" class="skeleton w-75 d-inline-block">6931ec89233511960e6b0feb</span></p>
                    <button class="btn btn-outline-warning w-100 mt-3">Editar Perfil</button>
                </div>
            </div>

            <div class="col-md-8 mb-4">
                <div class="section-card p-4">
                    <h4 class="border-bottom pb-2 mb-3">📦 Historial de Pedidos</h4>
                    <div id="orderHistory" class="list-group">
                        <div class="text-center p-5" id="loadingOrders">
                            <div class="spinner-border text-warning" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                            <p class="mt-2">Cargando tu historial de batalla...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8000/api';
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', function() {
            const userString = localStorage.getItem('doggyUser');
            if (userString) {
                currentUser = JSON.parse(userString);
                displayUserProfile();
                loadOrderHistory();
            } else {
                alert('Debe iniciar sesión para acceder a su cuenta.');
                window.location.href = 'login.html';
            }
        });

        function displayUserProfile() {
            document.getElementById('userName').textContent = currentUser.name;
            document.getElementById('userEmail').textContent = currentUser.email;
            document.getElementById('userId').textContent = currentUser.id;
            
            const date = new Date(currentUser.memberSince);
            document.getElementById('memberSince').textContent = date.toLocaleDateString('es-CL');
        }

        async function loadOrderHistory() {
            const historyContainer = document.getElementById('orderHistory');
            const loadingSpinner = document.getElementById('loadingOrders'); // Referencia directa al spinner

            // 1. Mostrar Spinner mientras carga
            loadingSpinner.style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/orders/${currentUser.id}`);
                const orders = await response.json();

                // 2. Ocultar Spinner AHORA que tenemos la respuesta
                loadingSpinner.style.display = 'none';

                if (orders.length === 0) {
                    historyContainer.innerHTML = '<p class="text-center mt-3">Aún no tienes pedidos. ¡A la batalla!</p>';
                    return;
                }
                
                // 3. Limpiar el contenedor solo del spinner y luego renderizar
                // Esto es crucial para que no borre el spinner antes de tiempo.
                historyContainer.innerHTML = orders.map(order => createOrderHtml(order)).join('');
            } catch (error) {
                console.error('Error cargando historial de pedidos:', error);
                
                // 4. Mostrar error si falla la API
                loadingSpinner.style.display = 'none';
                historyContainer.innerHTML = '<p class="text-danger mt-3">❌ Error al cargar pedidos. Verifique la API.</p>';
            }
        }
        
        function createOrderHtml(order) {
            const statusBadge = order.status === 'entregado' ? 'bg-success' : 
                                  order.status === 'en_camino' ? 'bg-warning' : 'bg-secondary';
            const statusText = order.status === 'entregado' ? 'Entregado' :
                             order.status === 'en_camino' ? 'En camino' : 'Procesando';
            
            const date = new Date(order.date).toLocaleDateString('es-CL', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            
            const itemsSummary = order.items.map(item => `${item.quantity}x ${item.name}`).join(', ');

            const setTrackingNumber = `localStorage.setItem('trackingNumber', '${order.order_number}'); window.location.href = 'rastreo.html';`;
            
            const trackingButton = (order.status !== 'entregado') ? 
                `<button onclick="${setTrackingNumber}" class="btn btn-sm btn-outline-primary">🚚 Rastrear</button>` : 
                '';


            return `
                <div class="list-group-item list-group-item-action bg-dark text-white">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <h6 class="mb-1 text-warning">📦 Pedido #${order.order_number}</h6>
                            <p class="mb-1">${itemsSummary}</p>
                            <small>📅 ${date} - 💰 $${order.total.toLocaleString()}</small>
                        </div>
                        <div class="text-end">
                            <span class="badge ${statusBadge} order-badge mb-2">${statusText}</span>
                            <br>
                            ${trackingButton}
                        </div>
                    </div>
                </div>
            `;
        }


        function logout() {
            if (confirm('¿Estás seguro de cerrar sesión?')) {
                localStorage.removeItem('doggyUser');
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
