<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastrear Pedido - Doggy's</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .nav-custom {
            background: rgba(26, 26, 46, 0.95) !important;
        }
        .tracking-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
        }
        .step {
            text-align: center;
            padding: 10px;
        }
        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 5px;
            font-size: 1.2rem;
            opacity: 0.5;
            transition: all 0.5s ease;
        }
        .step-active .step-circle {
            opacity: 1;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }
        .step-done .step-circle {
            background-color: #198754;
            opacity: 1;
        }
        .step-active .step-text {
            font-weight: bold;
            color: #ffc107;
        }
        .message-driver { /* ... (Estilos de chat se mantienen) ... */ }
        .message-user { /* ... (Estilos de chat se mantienen) ... */ }
        
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg nav-custom sticky-top">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold" href="index.html">DOGGY'S 🌭</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="cuenta.html">Historial</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="text-center mb-5 text-warning">🚚 Rastrear Pedido</h1>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="tracking-card p-4 shadow-lg">
                    <h4 class="border-bottom pb-2 mb-3">#<span id="orderNumberDisplay">Cargando...</span></h4>
                    <p class="mb-1">Estado actual: <span id="orderStatus" class="fw-bold text-warning">Cargando...</span></p>
                    <p>Tiempo estimado de llegada: <span id="eta" class="fw-bold text-success">--</span></p>
                    
                    <hr>

                    <div class="row text-center my-4">
                        <div class="col-3 step" id="step1">
                            <div class="step-circle bg-info">📝</div>
                            <small class="step-text">Confirmado</small>
                        </div>
                        <div class="col-3 step" id="step2">
                            <div class="step-circle bg-primary">🧑‍🍳</div>
                            <small class="step-text">En Preparación</small>
                        </div>
                        <div class="col-3 step" id="step3">
                            <div class="step-circle bg-warning">🏍️</div>
                            <small class="step-text">En Camino</small>
                        </div>
                        <div class="col-3 step" id="step4">
                            <div class="step-circle bg-success">🎉</div>
                            <small class="step-text">Entregado</small>
                        </div>
                    </div>
                    
                    <hr>

                    <h5 class="mt-4 mb-3">Chat con el Repartidor (Juan)</h5>
                    <div id="chatBox" class="p-3 mb-3 bg-dark rounded">
                        <div class="message message-driver">
                            <strong>Juan:</strong> ¡Hola! Tu pedido está en camino
                        </div>
                    </div>

                    <div class="input-group">
                        <input type="text" id="messageInput" class="form-control" placeholder="Escribe un mensaje..." disabled>
                        <button class="btn btn-warning" onclick="sendMessage()" id="sendBtn" disabled>Enviar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8000/api';
        const orderNumber = localStorage.getItem('trackingNumber');
        let currentStatus = 'procesando';

        document.addEventListener('DOMContentLoaded', function() {
            if (!orderNumber) {
                alert('No se encontró un número de pedido para rastrear. Regresando al historial.');
                window.location.href = 'cuenta.html';
                return;
            }
            
            document.getElementById('orderNumberDisplay').textContent = orderNumber;
            fetchOrderDetails();
            setInterval(fetchOrderDetails, 30000); 
        });

        async function fetchOrderDetails() {
            try {
                const response = await fetch(`${API_URL}/orders/order_number/${orderNumber}`);
                const order = await response.json();
                
                if (response.ok) {
                    currentStatus = order.status;
                    updateTrackingDisplay(currentStatus);
                } else {
                    document.getElementById('orderStatus').textContent = `Error: ${order.detail}`;
                }
            } catch (error) {
                console.error('Error al obtener detalles del pedido:', error);
                document.getElementById('orderStatus').textContent = 'Error de conexión al servidor.';
            }
        }
        
        function updateTrackingDisplay(status) {
            const steps = {
                'procesando': 1,
                'en_preparacion': 2,
                'en_camino': 3,
                'entregado': 4
            };
            
            const statusText = {
                'procesando': 'Procesando (Esperando al cocinero...)',
                'en_preparacion': 'En Preparación (¡Tu Hot Dog está casi listo!)',
                'en_camino': 'En Camino (Juan el repartidor está cerca)',
                'entregado': 'Entregado (¡A disfrutar!)'
            };

            const etaText = {
                'procesando': '--',
                'en_preparacion': '20-30 min',
                'en_camino': `${Math.floor(Math.random() * (15 - 5 + 1) + 5)} min`, 
                'entregado': '¡Ya llegó!'
            };
            
            const currentStep = steps[status] || 1;
            
            document.getElementById('orderStatus').textContent = statusText[status];
            document.getElementById('eta').textContent = etaText[status];

            const chatEnabled = status === 'en_camino';
            document.getElementById('messageInput').disabled = !chatEnabled;
            document.getElementById('sendBtn').disabled = !chatEnabled;

            for (let i = 1; i <= 4; i++) {
                const stepElement = document.getElementById(`step${i}`);
                stepElement.classList.remove('step-done', 'step-active');
                
                if (i < currentStep) {
                    stepElement.classList.add('step-done');
                } else if (i === currentStep) {
                    stepElement.classList.add('step-active');
                }
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (message === '') return;
            
            // ... (Lógica de chat simulado se mantiene) ...
        }
        
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
