<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Doggy's</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
        }
        
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #00f5ff;
            box-shadow: 0 0 0 0.25rem rgba(0, 245, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="login-container p-4 p-md-5 shadow-lg">
                    <h1 class="text-center mb-4 text-warning">🔐 Login</h1>
                    
                    <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab" aria-controls="login" aria-selected="true">Iniciar Sesión</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab" aria-controls="register" aria-selected="false">Crear Cuenta</button>
                        </li>
                    </ul>
                    <div class="tab-content" id="myTabContent">
                        <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
                            <h4 class="mb-4">Ingresa a Doggy's</h4>
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="loginEmail" placeholder="tu@email.com o admin@doggys.cl" required>
                                </div>
                                <div class="mb-4">
                                    <label for="loginPassword" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="btn btn-warning w-100">🔥 Iniciar Sesión</button>
                            </form>
                        </div>

                        <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="register-tab">
                            <h4 class="mb-4">Únete a la Batalla</h4>
                            <form id="registerForm">
                                <div class="mb-3">
                                    <label for="registerName" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="registerName" placeholder="Tu nombre" required>
                                </div>
                                <div class="mb-3">
                                    <label for="registerEmail" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="registerEmail" placeholder="correo@ejemplo.cl" required>
                                </div>
                                <div class="mb-3">
                                    <label for="registerPassword" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="registerPassword" minlength="6" required>
                                </div>
                                <div class="mb-4">
                                    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                                    <input type="password" class="form-control" id="confirmPassword" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">✨ Crear Cuenta</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8000/api';

        // Redirigir si ya hay sesión
        const user = JSON.parse(localStorage.getItem('doggyUser'));
        if (user && user.id) {
            window.location.href = user.role === 'admin' ? 'admin.html' : 'cuenta.html';
        }

        // --- INICIAR SESIÓN ---
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    const loggedInUser = data.user || data; 
                    localStorage.setItem('doggyUser', JSON.stringify(loggedInUser));

                    alert(`🎉 ¡Bienvenido de vuelta, ${loggedInUser.name}!`);

                    if (loggedInUser.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'cuenta.html';
                    }
                } else {
                    alert(`❌ Error de login: ${data.detail || 'Credenciales inválidas'}`);
                }
            } catch (error) {
                console.error('Error en la conexión al API:', error);
                alert('❌ Error al intentar conectar con el servidor.');
            }
        });

        // --- CREAR CUENTA (Registro) ---
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert('❌ Las contraseñas no coinciden');
                return;
            }

            // Enviar datos al API para registro
            try {
                const response = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    const createdUser = data.user;
                    // Iniciar sesión automáticamente
                    localStorage.setItem('doggyUser', JSON.stringify({
                        id: createdUser._id, 
                        name: createdUser.name,
                        email: createdUser.email,
                        role: createdUser.role,
                        memberSince: createdUser.memberSince,
                    }));
                    
                    alert(`🎉 ¡Cuenta creada exitosamente! Bienvenido a Doggy's, ${name}`);
                    window.location.href = 'cuenta.html';
                } else {
                    alert(`❌ Error al registrar: ${data.detail || 'Email ya registrado'}`);
                }
            } catch (error) {
                console.error('Error en la conexión al API:', error);
                alert('❌ Error al intentar conectar con el servidor.');
            }
        });
    </script>
</body>
</html>
